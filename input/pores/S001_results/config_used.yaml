runtime:
  device: auto
  gpu_memory_fraction: 0.8
  tile_size: 1024
  tile_batch_size: auto
  threads: auto
  prefetch: true
input:
  path: test_images/193193
  extensions:
  - .tif
  - .tiff
  - .png
  - .jpg
  - .jpeg
  - .bmp
  gray_weights:
  - 0.299
  - 0.587
  - 0.114
  views: null
sample:
  roi:
    name: imagej
  scale:
    name: scale_bar
    ocr_engines:
    - rapidocr
    ink_max: 120
    box_white_min: 255
    box_white_fallback: 250
    expected_min_um_per_px: 0.01
    expected_max_um_per_px: 100.0
    exclusion_pad_px: 4
  frame:
    name: edge_lines
    normal_window_px: 5
    corner_trim: 0.15
preprocessing:
- name: background_correction
  window_px: 100
  work_scale: 4
detection:
  name: hysteresis
  seed_threshold: 0.4
  grow_threshold: 0.55
  spot_sigma_px: 0.8
  spot_threshold: 0.21
postprocessing:
  mask_steps: []
  labeling:
    name: connected_components
    connectivity: 8
  label_steps:
  - name: pore_properties
evaluation:
- name: porosity
- name: pore_index
  stress_fields_dir: stress_fields
  stress: bending
  pore_stress: area
  q_values:
  - 1
  - 1.5
  - 2
  - 3
  - 5
  - 10
  cracks_outer: 0
  cracks_inner: 0
  hardness_outer: null
  hardness_inner: null
- name: comparison
- name: frame_picture
plots:
- name: pore_areas
- name: phi_over_q
- name: pores_over_height
- name: critical_pores
  q: 10
  top: 20
  all_q: true
- name: critical_pores_split
  q: 10
  top: 20
  all_q: true
- name: pore_sizes
output:
  dir: test_images/results
  save_full_overlay: false
  draw_on: pores
logging:
  level: INFO
  file: null
gui:
  theme: system
