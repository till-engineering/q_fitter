# q_fitter – the ONE place for all settings (no defaults in code, no command-line options).
# Paths are relative to the project folder (or absolute).

input:
  pores_dir: input/pores            # Pore_Detection outputs: drag the <ID>_results folders in here
  cracks_dir: input/cracks          # Fatigue_crack_labeler outputs: the <ID>_results folders (or only
                                    # the <ID>_cracks.xlsx); searched recursively for *_cracks.xlsx
  stress_fields_dir: input/stress_fields   # stress field YAMLs (same files as in Pore_Detection);
                                    # the field of an image is the one its run used (images.json)

stress:
  pore_stress: run                  # start value of the switch in the window (stress of a pore):
                                    #   run      = as in the Pore_Detection run (images.json)
                                    #   area     = every pixel with its own stress
                                    #   centroid = stress at the centroid (per zone)
                                    #   max      = highest stress in the pore (per zone)
                                    #   mean     = stress averaged over the whole pore

q:                                  # slider: fixed limits, one q for all IDs
  min: 0.0
  max: 30.0
  step: 0.1
  start: 10.0

plot:
  top: 20                           # pores shown as bars (and numbered on the sample)
  height_ratio: 0.25               # plot height = window width x this (larger = bigger sample picture)
  picture_max_px: 1600              # long edge of the sample picture (straightened, scaled down)
  picture_margin: 0.04              # embedding resin shown around the sample, share of its long side
  font_size: 11
